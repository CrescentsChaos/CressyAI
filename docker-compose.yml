# SearXNG for CressyAI's Web button.   docker compose up -d     (stop: docker compose down)
# Listens on 127.0.0.1:8080 only, so nothing else on your network can use it.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: cressy-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
