<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iNaturalist — CressyAI</title>
<link rel="icon" type="image/png" href="/assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b10;--panel:#0e1117;--card:#141822;--card2:#1a2030;--line:#252b3b;--ink:#e9ecf5;--mut:#8d95aa;--acc:#8b7cff;--acc2:#2dd4bf;--danger:#ff6b6b;--shadow:0 14px 40px -14px #000c;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f5fb;--panel:#fbfbfe;--card:#fff;--card2:#eef0f8;--line:#e2e5f0;--ink:#151826;--mut:#626a80;--acc:#5b4bf0;--acc2:#0d9488;--danger:#dc2626;--shadow:0 14px 40px -16px #2a2f5a40;color-scheme:light}}
:root[data-theme=light]{--bg:#f4f5fb;--panel:#fbfbfe;--card:#fff;--card2:#eef0f8;--line:#e2e5f0;--ink:#151826;--mut:#626a80;--acc:#5b4bf0;--acc2:#0d9488;--danger:#dc2626;--shadow:0 14px 40px -16px #2a2f5a40;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(55% 45% at 72% -8%,#7c6cff30,transparent 70%),radial-gradient(45% 40% at -4% 104%,#2dd4bf1c,transparent 70%),var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.top img{width:28px;height:28px}.top b{font:700 18px Sora,Inter,sans-serif;flex:1}
.top a,.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--ink);text-decoration:none;font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn:hover,.top a:hover{border-color:var(--acc)}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;overflow:auto}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 12px;color:var(--mut);font-weight:600}.tabs button.on{background:var(--card2);color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar input{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.loc{color:var(--mut);font-size:12.5px;margin:-6px 0 14px}.err{background:#ff6b6b18;border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);text-align:left;padding:0}.tile:hover{border-color:var(--acc)}
.tile .ph{aspect-ratio:4/3;background:var(--card2) center/cover}.tile div.t{padding:9px 11px}.tile h4{margin:0;font-size:14px}.tile small,.mut{color:var(--mut)}
.badge{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:600;background:var(--card2);border:1px solid var(--line)}.badge.risk{color:var(--danger);border-color:var(--danger)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.hero .img{border-radius:12px;aspect-ratio:4/3;background:var(--card2) center/cover}.hero h2{font:700 24px Sora,Inter,sans-serif;margin:0}.hero i{color:var(--mut)}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow:auto}.thumbs span{flex:0 0 64px;height:48px;border-radius:8px;background:center/cover;border:1px solid var(--line);cursor:pointer}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0}.facts dt{color:var(--mut)}.facts dd{margin:0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}.sec h3{margin:0 0 6px;font-size:14.5px}.sec p{margin:0}
.crumb button{background:none;border:0;color:var(--acc);padding:0}.months{display:flex;gap:4px;align-items:flex-end;height:64px}.months span{flex:1;background:var(--acc2);border-radius:4px 4px 0 0;opacity:.85}.ml{display:flex;gap:4px;color:var(--mut);font-size:10.5px}.ml span{flex:1;text-align:center}
.drop{border:2px dashed var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--mut);background:var(--card)}.drop.on{border-color:var(--acc)}.drop img{max-height:260px;border-radius:12px}
.cand{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}.cand .ph{width:56px;height:56px;border-radius:9px;background:var(--card2) center/cover}.cand .b{flex:1}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
</style>
<script>try{const theme=localStorage.getItem('gc.theme');if(['auto','light','dark'].includes(theme))document.documentElement.dataset.theme=theme}catch{}</script>
</head>
<body data-page="nature">
<script src="/js/19-nature.js"></script>
</body>
</html>
